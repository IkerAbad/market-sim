name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Documentation links
        run: python scripts/check_docs.py
      - name: Version consistency
        run: python scripts/check_versions.py
      - name: Results consistency
        run: python scripts/check_results.py
      - name: API reference
        run: python scripts/build_api_docs.py --check
      - name: Output hashes
        run: python scripts/check_hashes.py

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=market_sim --cov-report=term-missing --cov-fail-under=98

  reference:
    name: pinned reference environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-reference.txt -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=market_sim --cov-fail-under=98
      - name: Baseline reproduction
        run: |
          python scripts/run_simulation.py --config configs/baseline.json --output /tmp/reference_results
          python scripts/compare_baseline.py --results /tmp/reference_results --expected docs/baseline_metrics.json

  build:
    name: build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        run: |
          cd /tmp
          python -c "from market_sim import MetricsParams, ModelParams, SimulationConfig, compute_metrics, simulate; c = SimulationConfig(seed=1, n_steps=2000, burn_in=100, model=ModelParams(n_agents=40), metrics=MetricsParams(acf_lags=50)); r = simulate(c); print(compute_metrics(*r.analysis_window(), c.metrics)['kurtosis'])"

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t market-sim:ci .
      - name: Version
        run: docker run --rm market-sim:ci version
      - name: Simulate
        run: docker run --rm market-sim:ci simulate --config configs/baseline.json --set n_steps=500 --set burn_in=50 --set metrics.acf_lags=50 --output /tmp/results

  reproduce:
    name: reproduce baseline and figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Baseline
        run: |
          python scripts/run_simulation.py --config configs/baseline.json --output results
          python -c "import json; data = json.load(open('results/metrics.json', encoding='utf-8')); assert data['all_facts_pass'], data; print('baseline facts pass')"
      - name: Figures
        run: |
          python scripts/make_figures.py --results results --output /tmp/figures
          test -s /tmp/figures/price_series.png
          test -s /tmp/figures/return_histogram.png
          test -s /tmp/figures/autocorrelation.png
      - name: Ensemble smoke test
        run: |
          python scripts/run_ensemble.py --seeds 1-3 --jobs 3 --output /tmp/ensemble --report /tmp/robustness.md --csv-report /tmp/robustness.csv
          test -s /tmp/ensemble/metrics.csv
          test -s /tmp/robustness.md
          test -s /tmp/robustness.csv
      - name: Block stability
        run: |
          python scripts/run_stability.py --results results --blocks 10 --report /tmp/stability.md --csv /tmp/stability.csv
          test -s /tmp/stability.md
          test -s /tmp/stability.csv
      - name: Block stability across seeds
        run: |
          python scripts/run_block_ensemble.py --seeds 1-2 --blocks 10 --jobs 2 --report /tmp/block_ensemble.md --csv /tmp/block_ensemble.csv
          test -s /tmp/block_ensemble.md
          test -s /tmp/block_ensemble.csv
      - name: Benchmark pass rates
        run: |
          python scripts/run_benchmark_rates.py --series 10 --n 20000 --report /tmp/benchmark_rates.md --csv /tmp/benchmark_rates.csv
          test -s /tmp/benchmark_rates.md
          test -s /tmp/benchmark_rates.csv
      - name: Strict criteria
        run: |
          python scripts/run_strict_criteria.py --input docs/robustness_50.csv --report /tmp/strict_criteria.md --csv /tmp/strict_criteria.csv
          test -s /tmp/strict_criteria.md
          test -s /tmp/strict_criteria.csv
      - name: Gaussian null distribution
        run: |
          python scripts/run_null_distribution.py --series 100 --n 20000 --report /tmp/null_distribution.md --csv /tmp/null_distribution.csv
          test -s /tmp/null_distribution.md
          test -s /tmp/null_distribution.csv
      - name: Discrimination grid
        run: |
          python scripts/run_discrimination.py --series 10 --n 20000 --report /tmp/discrimination.md --csv /tmp/discrimination.csv --grid-csv /tmp/discrimination_grid.csv --figure /tmp/discrimination.png
          test -s /tmp/discrimination.md
          test -s /tmp/discrimination_grid.csv
          test -s /tmp/discrimination.png
      - name: Additional facts discrimination
        run: |
          python scripts/run_additional_discrimination.py --seeds 1-2 --series 10 --n 20000 --jobs 2 --report /tmp/additional_discrimination.md --csv /tmp/additional_discrimination.csv
          test -s /tmp/additional_discrimination.md
          test -s /tmp/additional_discrimination.csv
