name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/*

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/market-sim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Extract release notes
        run: python scripts/release_notes.py --tag "${{ github.ref_name }}" --output release_notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "market-sim ${{ github.ref_name }}" --notes-file release_notes.md --verify-tag

  container:
    name: publish container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          docker build \
            -t "ghcr.io/ikerabad/market-sim:${VERSION}" \
            -t "ghcr.io/ikerabad/market-sim:latest" .
      - name: Smoke test
        run: docker run --rm "ghcr.io/ikerabad/market-sim:${VERSION}" version
      - name: Push
        run: |
          docker push "ghcr.io/ikerabad/market-sim:${VERSION}"
          docker push "ghcr.io/ikerabad/market-sim:latest"
