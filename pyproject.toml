[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sim"
version = "0.7.0"
description = "Agent-based toy market simulator for stylized facts of financial returns"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iker Abad" }]
keywords = [
    "agent-based model",
    "stylized facts",
    "econophysics",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6",
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/IkerAbad/market-sim"
Repository = "https://github.com/IkerAbad/market-sim"
Issues = "https://github.com/IkerAbad/market-sim/issues"

[project.scripts]
market-sim = "market_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_sim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["market_sim"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["market_sim"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 98

[tool.coverage.html]
directory = "htmlcov"
