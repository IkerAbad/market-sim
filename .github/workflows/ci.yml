name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=market_sim --cov-report=term-missing --cov-fail-under=90

  build:
    name: build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        run: |
          cd /tmp
          python -c "from market_sim import MetricsParams, ModelParams, SimulationConfig, compute_metrics, simulate; c = SimulationConfig(seed=1, n_steps=2000, burn_in=100, model=ModelParams(n_agents=40), metrics=MetricsParams(acf_lags=50)); r = simulate(c); print(compute_metrics(*r.analysis_window(), c.metrics)['kurtosis'])"
